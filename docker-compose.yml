services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9105:5173"
      - "3011:3011"
    env_file:
      - .env
    environment:
      - STORAGE_LOCAL_PATH=/app/storage/wallpapers
      - SHARED_FOLDER_PATH=/app/scripts
      - PORT=3011
      - DOCKER=1
      - VITE_HMR_CLIENT_PORT=9105
    volumes:
      - ./:/app
      - app_node_modules:/app/node_modules
      - /srv/wallpaper-scheduler/scripts:/app/scripts
      - /srv/wallpaper-scheduler/storage:/app/storage
    command: npm run dev

volumes:
  app_node_modules:
